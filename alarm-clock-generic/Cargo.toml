[package]
name = "alarm-clock-generic"
version = "0.3.0"
authors = ["Alex Sampley"]
edition = "2024"

[features]
default = ["synth-pulse", "synth-sample"]
defmt = [
	"dep:defmt",
	"dep:defmt-rtt",
	"dir-static/defmt",
	"defmt-or-log/defmt",
	"embassy-executor/defmt",
	"embassy-sync/defmt",
	"embassy-time/defmt",
	"embedded-hal/defmt-03",
	"embedded-hal-async/defmt-03",
	"heapless/defmt",
]

log = [
	"dep:log",
	"defmt-or-log/log",
	"embassy-executor/log",
	"embassy-sync/log",
	"embassy-time/log",
]

synth-pulse = []
synth-sample = []

[dependencies]
dir-static = { path = "../dir-static" }
pre-table = { path = "../pre-table" }

bincode = { version = "2.0", default-features = false, features = ["derive"] }

defmt-or-log = { version = "0.2.3" }
defmt = { version = "1.0", optional = true }
defmt-rtt = { version = "1.0", optional = true }
log = { version = "0.4.33", optional = true }

embassy-executor = { version = "0.10.0", features = ["nightly"] }
embassy-sync = { version = "0.7.0", features = [] }
embassy-time = { version = "0.5.0", features = ["generic-queue-8"] }

embedded-hal = { version = "1.0" }
embedded-hal-async = { version = "1.0" }

derive_more = { version = "2.0", default-features = false, features = ["full"] }
enum_dispatch = "0.3.13"
futures-lite = { version = "2.6", default-features = false }
heapless = { version = "0.9.0", default-features = false, features = ["serde"] }
libm = { version = "0.2.11" }
midly = { version = "0.5.3", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.6.0"
thiserror = { version = "2.0.9", default-features = false }
