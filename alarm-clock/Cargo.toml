[package]
name = "alarm-clock"
version = "0.2.0"
authors = ["Alex Sampley"]
edition = "2021"

[features]
default = []

[dependencies]
dir-static = { path = "../dir-static" }
pre-table = { path = "../pre-table" }

bincode = { version = "2.0", default-features = false, features = ["derive"] }

embassy-executor = { version = "0.9.0", features = ["defmt", "nightly"] }
embassy-sync = { version = "0.7.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt", "generic-queue-8"] }

embedded-hal = { version = "1.0", features = ["defmt-03"] }
embedded-hal-async = { version = "1.0", features = ["defmt-03"] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-storage = "0.3.1"

critical-section = "1.2.0"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
enum_dispatch = "0.3.13"
futures-lite = { version = "2.6", default-features = false }
heapless = { version = "0.9.0", default-features = false, features = ["serde", "defmt"] }
libm = { version = "0.2.11" }
log = "0.4.22"
midly = { version = "0.5.3", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.6.0"
static_cell = { version = "2.1.0", features = ["nightly"] }
thiserror = { version = "2.0.9", default-features = false }

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-backtrace = { version = "0.18.0", features = ["esp32s3", "panic-handler", "defmt" ] }
esp-hal = { version = "1.0", features = ["esp32s3", "defmt", "unstable"] }
esp-rtos = { version = "0.2.0", features = ["embassy", "esp32s3"] }
esp-storage = { version = "0.8.0", features = ["esp32s3"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3", "defmt"] }
