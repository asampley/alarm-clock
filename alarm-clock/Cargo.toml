[package]
name = "alarm-clock"
version = "0.2.0"
authors = ["Alex Sampley"]
edition = "2024"

[features]
default = []
esp32s2 = ["esp-backtrace/esp32s2", "esp-hal/esp32s2", "esp-rtos/esp32s2", "esp-storage/esp32s2", "esp-bootloader-esp-idf/esp32s2"]
esp32s3 = ["esp-backtrace/esp32s3", "esp-hal/esp32s3", "esp-rtos/esp32s3", "esp-storage/esp32s3", "esp-bootloader-esp-idf/esp32s3"]

[dependencies]
dir-static = { path = "../dir-static" }
pre-table = { path = "../pre-table" }

bincode = { version = "2.0", default-features = false, features = ["derive"] }

embassy-executor = { version = "0.9.0", features = ["defmt", "nightly"] }
embassy-sync = { version = "0.7.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt", "generic-queue-8"] }

embedded-hal = { version = "1.0", features = ["defmt-03"] }
embedded-hal-async = { version = "1.0", features = ["defmt-03"] }
embedded-storage = "0.3.1"

defmt = "1.0.1"
defmt-rtt = "1.0.0"
derive_more = { version = "2.0", default-features = false, features = ["full"] }
enum_dispatch = "0.3.13"
futures-lite = { version = "2.6", default-features = false }
heapless = { version = "0.9.0", default-features = false, features = ["serde", "defmt"] }
libm = { version = "0.2.11" }
midly = { version = "0.5.3", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.6.0"
thiserror = { version = "2.0.9", default-features = false }

esp-backtrace = { version = "0.18.0", features = ["panic-handler", "defmt"], optional = true }
esp-hal = { version = "1.0", features = ["defmt", "unstable"], optional = true }
esp-rtos = { version = "0.2.0", features = ["embassy"], optional = true }
esp-storage = { version = "0.8.0", features = [], optional = true }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt"], optional = true }
